<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gatecraft - freeze one decision, prove it on every input</title>
<meta name="description" content="Ask a model once for every situation your program can be in, compile the answers into a NAND circuit proven on every input, check twenty yourself, and ship a 4 KB module. Runs in your browser; open source, MIT.">
<meta name="theme-color" content="#171513">
<meta property="og:type" content="website">
<meta property="og:site_name" content="gatecraft">
<meta property="og:url" content="https://gatecraft.fun/">
<meta property="og:title" content="gatecraft - freeze one decision, prove it on every input">
<meta property="og:description" content="Ask a model once for every situation, compile the answers into NAND gates, prove the circuit on every input, and ship a 4 KB file. Try it in your browser.">
<meta property="og:image" content="https://gatecraft.fun/ui/og.png">
<meta property="og:image:width" content="2400">
<meta property="og:image:height" content="1260">
<meta property="og:image:alt" content="A comment-moderation decision running as 32 proven NAND gates">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 24'%3E%3Cpath d='M3 3h12a9 9 0 0 1 0 18H3z' fill='none' stroke='%23c8622b' stroke-width='3'/%3E%3Ccircle cx='28' cy='12' r='3' fill='%23c8622b'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script type="module" src="app.mjs"></script>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg class="logo" viewBox="0 0 34 24" aria-hidden="true"><path d="M3 3h12a9 9 0 0 1 0 18H3z"/><circle cx="28" cy="12" r="3"/></svg>
    <span class="wordmark">gatecraft</span>
    <span class="tagline" data-i18n="tagline"></span>
  </div>
  <nav class="stepper" id="stepper" data-i18n-label="stepsLabel"></nav>
  <div class="head-tools">
    <button type="button" class="pill" id="model-button"></button>
    <button type="button" class="pill ghost" id="decide-switch"></button>
    <button type="button" class="pill ghost" id="gallery-switch"></button>
    <button type="button" class="pill ghost" id="view-switch"></button>
    <a class="pill ghost api-pill" id="api-pill" href="/api" hidden></a>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="zh">中文</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </div>
</header>
<section class="settings" id="settings" hidden></section>
<main class="flow" id="flow"></main>
<main class="flow" id="gallery" hidden></main>
<main class="flow" id="decide" hidden></main>
<main class="layout" id="workbench" hidden>
  <section class="card" id="describe">
    <h2 class="step"><span class="num">1</span><span data-i18n="stepDescribe"></span></h2>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div id="editor"></div>
  </section>
  <section class="card" id="prove">
    <h2 class="step"><span class="num">2</span><span data-i18n="stepProve"></span></h2>
    <div id="compile-bar"></div>
    <div id="proof"></div>
  </section>
  <section class="card span" id="circuit-section" hidden>
    <h2 class="step"><span class="num">3</span><span data-i18n="stepTry"></span></h2>
    <div id="circuit"></div>
  </section>
  <section class="card span" id="tapeout-section" hidden>
    <h2 class="step"><span class="num">4</span><span data-i18n="stepTapeout"></span></h2>
    <div id="tapeout"></div>
  </section>
</main>
<footer class="foot"><span data-i18n="footer"></span> <span class="build mono"></span></footer>
<noscript><p class="foot">gatecraft needs JavaScript.</p></noscript>
</body>
</html>
